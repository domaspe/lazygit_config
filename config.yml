gui:
  scrollHeight: 5
git:
  diffContextSize: 50
  pagers:
    - colorArg: always
      pager: $HOME/.config/lazygit/delta-theme.sh --paging=never
    - colorArg: always
      pager: $HOME/.config/lazygit/delta-theme.sh --paging=never --side-by-side
os:
  edit: "nvim --server $NVIM --remote-send '<C-\\><C-n>:silent! close<CR>' && nvim --server $NVIM --remote {{filename}}"
  editAtLine: "nvim --server $NVIM --remote-send '<C-\\><C-n>:silent! close<CR>' && nvim --server $NVIM --remote +{{line}} {{filename}}"
  editInTerminal: false
  openDirInEditor: false
customCommands:
  - key: "<c-a>"
    description: "Generate AI commit message"
    command: "git diff --cached | claude --model sonnet --effort high -p 'Generate a git commit message for these staged changes. Use conventional commit format (feat/fix/refactor/etc). Subject line, blank line, then a short body. Lead with what changed and why. Stay at the level of intent and outcome — describe the change as a whole, not file-by-file or symbol-by-symbol edits. Before writing, scan the diff for behavior changes that affect existing code paths or existing data, not only the new feature surface; these are the most important things to surface and must be called out explicitly, ideally as their own bullet, with a note on what they affect. Renames, helper generalizations, and refactors that follow mechanically from the new feature are not bullets. When the diff contains several similar-sounding identifiers (e.g. CSV codes, enum values, slugs, tag names), keep them distinct — never collapse different identifier sets into the same word, and name each by what it actually is. Only include a bullet when it adds information the lead does not already imply. If the lead already conveys that the change spans several surfaces, do not restate those surfaces as bullets. Prefer no bullets over restating the lead. Aim for 2-4 bullets when bullets are warranted; go beyond 4 only when the commit is genuinely large enough that 4 cannot cover it. Keep technical terms (function names, file paths, error strings, identifiers) verbatim when you do mention them. Plain English, complete sentences, common words. No filler, no hedging, no idioms. State facts directly. Output ONLY the commit message itself, with nothing before or after it: no preface such as Here is the commit message, no surrounding code fences or backticks, no quotes, and no commentary or notes after the message. The first line of your output must be the subject line. Use exactly this template, with literal newlines and a blank line between sections:\n\ntype(scope): short imperative subject\n\nShort paragraph describing what changed and why.\n\n- optional bullet\n- optional bullet' | tee \"$(git rev-parse --git-path LAZYGIT_PENDING_COMMIT)\""
    context: "files"
  - key: "<c-n>"
    description: "Suggest new branch name"
    command: "git diff --cached | claude --model opus --effort low -p 'Based on these staged changes, suggest a single concise git branch name in kebab-case with a conventional prefix (e.g. feature/, fix/, refactor/, chore/, docs/). Output ONLY the branch name, nothing else.' | grep . | tee /dev/stderr | clip.exe"
    context: "localBranches"
